# Every planning assumption in one place. The UI reads this file and makes each value editable.
# Change a value here, never as a constant in code. Mark the source of each value or label it as an assumption.

event:
  name: Super Bowl LXI
  game_date: "2027-02-14"
  kickoff_local: "15:30"            # assumption: 2022 SoFi kickoff time; LXI time not yet announced
  window: ["2027-02-09", "2027-02-15"]
  replay_shift_days: 1827           # 261 weeks: Sun 2022-02-13 -> Sun 2027-02-14

fbo:
  name: Sepulveda Jet Center (fictional)
  airport: KVNY
  capacity_large_equiv: 48          # assumption
  reservation_buffer_pct: 10        # assumption: keep 10% of stands unbooked
  share_of_airport_arrivals: 0.30   # assumption: our FBO's share of KVNY bizjet arrivals (4 major FBOs)
  temp_taxiway_stands: 12           # assumption: extra stands if a taxiway is closed for parking (strategy C)
  staff_on_shift: 10                # assumption: line techs per shift in an ordinary week
  fuel_trucks: 3                    # assumption

large_equiv_factor:                 # parking footprint per size class (assumption)
  light: 0.4
  mid: 0.6
  super_mid: 0.8
  large: 1.0
  other: 0.6

fuel:
  gal_per_departure_blended: 1100   # assumption, refine by size class
  refueler_capacity_gal: 5000       # assumption
  co2_kg_per_gal: 9.75              # EPA emission factor, kerosene-type jet fuel
  gal_per_nm_repositioning: 1.0     # assumption, blended incl. climb

overflow:
  partner_airports: [KWHP, KCMA, KBUR]
  empty_legs_per_overflow_aircraft: 2
  adhoc_reposition_nm: 150          # assumption: unmanaged overflow distance
  partner_reposition_nm: 40         # assumption: nearest partner distance (used only when no partner is modelled)
  partner_spaces:                   # assumption: large-cabin equivalents each partner FBO holds for us; distances are great-circle from KVNY
    KWHP: 6
    KBUR: 8
    KCMA: 12

customs_kvny:                       # CBP KVNY GA fact sheet, June 2024 (verify for 2027)
  facility: Signature West GAF only
  hours_local:
    mon: ["09:00", "20:30"]
    tue: ["15:00", "20:30"]
    wed: ["15:00", "20:30"]
    thu: ["09:00", "20:30"]
    fri: ["09:00", "14:30"]
    sat: ["09:00", "14:30"]
    sun: ["09:00", "20:30"]
  landing_rights_tolerance_min: 30

curfew_kvny:                        # VNY noise ordinance; departures only
  stage2_jets: ["22:00", "07:00"]
  older_stage3_jets: ["23:00", "07:00"]
  quieter_nights_voluntary: ["23:00", "07:00"]
  flagged_share_assumption:         # assumption: share of visiting jets each rule binds, until the registry join supplies noise stage
    stage2_jets: 0.02
    older_stage3_jets: 0.08
  curfew_alert_lookahead_h: 10

tfr_game_day:                       # 2022 / 2026 precedent; LXI NOTAM not yet published
  window_local: ["14:30", "20:30"]
  inner_core_nm: 10
  outer_ring_nm: 30

priority_rules:
  tight_slack_min: 60               # assumption: a fixed-time commitment counts as urgent once its slack is this small (or negative)

priority_weights_default:           # manager-editable; need-based only
  fixed_time: 0.4
  medical_access: 0.3
  hard_deadline: 0.2
  wait: 0.1

alerts:
  ramp_threshold_pct: 90
  ramp_lookahead_h: 2

drive_minutes:                      # assumption: typical midday drive time, airport -> hotel zone
  KVNY: {Beverly Hills: 35, Santa Monica: 40, Downtown LA: 45, Inglewood: 50, Burbank: 20}
  KBUR: {Beverly Hills: 30, Santa Monica: 45, Downtown LA: 25, Inglewood: 45, Burbank: 8}
  KWHP: {Beverly Hills: 40, Santa Monica: 45, Downtown LA: 40, Inglewood: 55, Burbank: 18}
  KCMA: {Beverly Hills: 60, Santa Monica: 55, Downtown LA: 70, Inglewood: 70, Burbank: 55}
  KLGB: {Beverly Hills: 50, Santa Monica: 50, Downtown LA: 35, Inglewood: 30, Burbank: 50}
  KONT: {Beverly Hills: 70, Santa Monica: 80, Downtown LA: 55, Inglewood: 65, Burbank: 55}
  KLAX: {Beverly Hills: 30, Santa Monica: 25, Downtown LA: 35, Inglewood: 15, Burbank: 45}

alternates:                         # runway length approximate (verify against FAA airport data); customs status must be verified for 2027
  KBUR: {name: Hollywood Burbank, runway_ft: 6886, customs: verify, partner_parking: true}
  KWHP: {name: Whiteman, runway_ft: 4120, customs: "no", partner_parking: true}
  KCMA: {name: Camarillo, runway_ft: 6013, customs: "no", partner_parking: true}
  KLGB: {name: Long Beach, runway_ft: 10003, customs: verify, partner_parking: false}
  KONT: {name: Ontario Intl, runway_ft: 12197, customs: "yes", partner_parking: false}
  KLAX: {name: Los Angeles Intl, runway_ft: 12923, customs: "yes", partner_parking: false}

runway_needed_ft:                   # assumption: planning minimum by size class, not a performance calculation
  light: 4000
  mid: 4800
  super_mid: 5200
  large: 5800
  other: 5000

parking:                            # parking positions beyond the 48 stands (assumptions for the fictional FBO)
  hot_spots: 4                      # short-term drop-and-go positions by the terminal, max 3 h
  hot_spot_max_hours: 3
  temp_zone_stands: 12              # taxiway closed for parking (strategy C), needs airport + FAA approval
  tows_per_block: 2                 # out and back for each boxed-in event
  departure_uncertainty_h:          # assumption: how far actual departures drift from the time the owner gave (1 sigma)
    over_20h: 3                     # long stays: owners leave when the party ends
    over_3h: 1
  cpsat:                            # Role 3 exact solver (rampcast/engine/stands.py), method=cpsat on the parking routes
    drift_margin_sigma: 1.0         # assumption: margin between jets in a column, in departure_uncertainty_h sigmas
    budget: 0.3                     # OR-Tools deterministic time per daily window; ~7 s per week, more is slower
  tandem:                           # game-day packing layout (assumptions; slot sizes = largest jet allowed + 3 m)
    hot_spots: 6
    temp_rows: 13                   # temporary taxiway zone, 3 deep, only if strategy C is approved
    temp_depth: 3
    pad_columns: 8                  # overflow pad west of the apron, 5 deep
    pad_depth: 5

parking_fees_usd:                   # assumption: per night, before event surcharge; drop-and-go is a flat handling fee
  light: 150
  mid: 250
  super_mid: 350
  large: 500
  other: 250
  drop_and_go_flat: 150
  event_multiplier: 2.0

bookings:                           # instant booking desk and the shared inbox (assumptions; replace with the FBO's own numbers)
  hold_minutes: 15                  # an instant answer holds the slot this long for the operator to accept
  stay_buffer_min: 15               # gap kept between one jet leaving a position and the next arriving
  auto_confirm_max_p_over: 0.2      # auto-confirm only when the forecast gives at most this chance of the ramp being over capacity
  eta_change_flag_min: 30           # live tracking moves the ETA by more than this: re-plan automatically and note it
  eta_change_look_min: 90           # moves by more than this: a person confirms with the crew and the car service
  tracking_horizon_h: 6             # live ETA known this long before landing (flight tracking)
  walk_in_share: 0.12               # arrivals with no request at all
  duplicate_share: 0.05             # trips requested twice through two channels
  aircraft_change_share: 0.03       # operator swaps to a bigger aircraft after requesting
  channel_mix:                      # how requests reach the FBO
    FlightBridge: 0.45
    Scheduler export: 0.20
    Email: 0.15
    Phone: 0.10
    FBO portal: 0.10
  lead_days:                        # how far ahead requests arrive, by stay type [min, max]
    event_stay: [14, 75]
    through_game: [14, 75]
    overnight: [2, 30]
    drop_and_go: [0, 7]
    pre_window: [7, 40]

forecast:                           # Role 2 forecast (rampcast/forecast). Each value has a source or is labelled an assumption.
  monte_carlo_runs: 5000
  seed: 61
  airport: KVNY
  baseline_dates: ["2022-01-15", "2022-01-21"]   # ordinary days in daily_counts.csv (reconstructed_2022); 2022-01-17 is MLK Day
  window_offsets: [-5, 1]           # 2027-02-09 (Tue) to 2027-02-15 (Mon, Presidents' Day); game day = 0
  traffic_level_2027: 1.0           # assumption: 2027 ordinary traffic relative to the 2022 baseline days
  count_dispersion: 1.5             # assumption: variance / mean of daily arrivals (negative binomial); 1.0 = Poisson
  week_level_sd: 0.10               # assumption: lognormal sd of a week-wide demand factor (a busy week is busy every day)
  uplift:
    anchor_offsets: [-3, 0]         # Thu..Sun before the game: the window the published arrival ratios describe
    shape_source: reconstructed_2022   # assumption: day-to-day shape from Role 1's rebuilt 2022 KVNY week
    fixed_offsets: [1]              # Monday after the game: same arrival multiplier in every scenario
    scenario_rule: {low: min, medium: mean, high: max}   # spread across the analogs used for level
  analogs:                          # published WingX figures; each has its own window and denominator
    - {event: SB_LVIII_2024, region: Las Vegas, metric: arrivals_ratio, value: 1.5, use: level,
       window: "event-weekend average daily arrivals vs February-to-date daily average",
       source: "WingX via AIN, 2024-02-13", url: "https://www.ainonline.com/aviation-news/business-aviation/2024-02-13/super-bowl-draws-flocks-aircraft-numbers-down-previous"}
    - {event: SB_LX_2026, region: Bay Area, metric: arrivals_ratio, value: 2.0, use: level,
       window: "Feb 5-8 2026 (Thu-Sun) arrivals vs normal February",
       source: "WingX via GlobalAir, 2026", url: "https://www.globalair.com/articles/bay-area-airports-report-3x-the-normal-business-jets-traffic-during-super-bowl/11933"}
    - {event: SB_LX_2026, region: Bay Area, metric: monday_departures_ratio, value: 3.0, use: check,
       window: "day-after departures vs typical February daily average",
       source: "WingX via GlobalAir, 2026", url: "https://www.globalair.com/articles/bay-area-airports-report-3x-the-normal-business-jets-traffic-during-super-bowl/11933"}
    - {event: SB_LVI_2022, region: Los Angeles, metric: monday_departures_ratio, value: 1.65, use: check,
       window: "548 day-after departures, +65% vs typical activity",
       source: "WingX via AIN, 2022-02-18", url: "https://www.ainonline.com/aviation-news/business-aviation/2022-02-18/super-bowl-brings-super-bounty-la-area-fbos"}
  fbo_reports_2022:                 # AIN informal FBO poll, 2022-02-18; used only as a plausibility range
    - {fbo: Castle & Cooke, airport: KVNY, metric: aircraft_in_week, value: 70}
    - {fbo: Million Air, airport: KBUR, metric: aircraft_in_week_prior, value: 170}
    - {fbo: Million Air, airport: KBUR, metric: aircraft_on_ramp_at_kickoff, value: 45}
    - {fbo: Ross Aviation, airport: KLGB, metric: jets_on_ramp_game_day, value: 75}
  stays:
    drop_and_go_share: 0.30         # reconstructed_2022: 30% of paired KVNY arrivals left within 2 h
    drop_and_go_minutes: [55, 120]
    ordinary_nights: [1, 2]         # assumption: visits that are not for the game stay 1-2 nights
    ordinary_departure_hours: [8, 17]
    stay_through_game_from_offset: -3   # assumption: non-drop-and-go arrivals from Thursday on stay through the game
    leave_after_game_share: 0.48    # reconstructed_2022: 126 stayers left on game day, 137 on Monday
    after_game_hours: [20.5, 23.5]  # local; after the game-day TFR ends at 20:30 (tfr_game_day)
    monday_departure_hours: [7.0, 14.0]
  game_day_arrival_damping: 0.35    # assumption: arrival rate during the game-day TFR window relative to normal
  pre_window_aircraft: 18           # assumption (engine default): transient aircraft already parked at 2027-02-09 00:00
  pre_window_departure_days: [0, 1] # they leave on window day 0 or 1, between ordinary_departure_hours
